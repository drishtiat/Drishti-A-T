<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drishti Computer Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#6366f1;--bg:#0f172a;--card:#1e293b;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:white;padding-bottom:30px}
header{background:linear-gradient(135deg,#6366f1,#4f46e5);padding:25px 20px;text-align:center;border-bottom-left-radius:30px;border-bottom-right-radius:30px}
header img{width:90px;height:90px;border-radius:50%;border:3px solid white;object-fit:cover}
.container{max-width:600px;margin:auto;padding:20px}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #334155}
.card h3{color:#38bdf8;margin-bottom:12px;font-size:15px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;color:white;background:#6366f1;margin-top:6px;font-weight:500}
.btn2{background:#10b981} .btnR{background:#ef4444}
input,select,textarea{width:100%;padding:12px;margin-bottom:10px;background:#0f172a;border:1px solid #475569;color:white;border-radius:8px;outline:none}
.hidden{display:none !important}
.test-item,.course-box,.pdf-box{background:#0f172a;padding:12px;border-radius:8px;margin-bottom:10px;border-left:4px solid #f59e0b;font-size:13px}
.banner-display{width:100%;max-height:180px;border-radius:12px;object-fit:cover;margin-bottom:12px;display:none;border:2px solid white}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px} th,td{border:1px solid #475569;padding:6px;text-align:center} th{background:#4f46e5}
</style>
</head>
<body>
<header>
<img id="headerBannerImg" class="banner-display">
