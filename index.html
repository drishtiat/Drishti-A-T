<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drishti Computer Centre - Portal</title>
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        .header-banner { width: 100%; max-height: 250px; object-fit: cover; display: none; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input[type="file"] { margin: 10px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <!-- Header Banner Section -->
    <div>
        <img id="headerBannerImg" class="header-banner" alt="Drishti Banner">
    </div>

    <div class="container">
        <h2>Drishti Computer Centre - Management Panel</h2>

        <!-- Banner Upload Section -->
        <div class="section">
            <h3>Banner Photo Update Karein</h3>
            <input type="file" id="bannerFileInput" accept="image/*">
            <br>
            <button onclick="uploadBannerImage()">Banner Save Karein</button>
        </div>

        <!-- Director/Teacher Photo Section -->
        <div class="section">
            <h3>Director / Teacher Photo Update Karein</h3>
            <input type="file" id="directorFileInput" accept="image/*">
            <br>
            <img id="directorPhotoImg" style="width: 100px; height: 100px; object-fit: cover; display: none; margin-top: 10px; border-radius: 50%;" alt="Director Photo">
            <br><br>
            <button onclick="uploadDirectorImage()">Director Photo Save Karein</button>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        // Apna Firebase configuration yahan dalein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. BANNER UPLOAD & REALTIME SYNC ---
        function uploadBannerImage() {
            let fileInput = document.getElementById("bannerFileInput");
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    db.ref('settings/banner').set(base64Image).then(() => {
                        alert("Banner safaltapoorvak save ho gaya hai!");
                    }).catch(err => {
                        alert("Truti: " + err.message);
                    });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Kripya pehle ek banner image chunein!");
            }
        }

        // Realtime listener for Banner
        db.ref('settings/banner').on('value', snap => {
            let b = snap.val();
            let img = document.getElementById("headerBannerImg");
            if (b) {
                img.src = b;
                img.style.display = "block";
            } else {
                img.style.display = "none";
            }
        });

        // --- 3. DIRECTOR PHOTO UPLOAD & REALTIME SYNC ---
        function uploadDirectorImage() {
            let fileInput = document.getElementById("directorFileInput");
            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let base64Image = e.target.result;
                    db.ref('settings/directorPhoto').set(base64Image).then(() => {
                        alert("Director photo safaltapoorvak save ho gayi hai!");
                    }).catch(err => {
                        alert("Truti: " + err.message);
                    });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Kripya pehle director ki photo chunein!");
            }
        }

        // Realtime listener for Director Photo
        db.ref('settings/directorPhoto').on('value', snap => {
            let p = snap.val();
            let img = document.getElementById("directorPhotoImg");
            if (p) {
                img.src = p;
                img.style.display = "block";
            } else {
                img.style.display = "none";
            }
        });
    </script>
</body>
</html>
